<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Drone Control</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #1c1c1e; color: #e5e5e7;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; overflow: hidden;
    -webkit-user-select: none; user-select: none;
}

/* --- Top bar --- */
.top-bar {
    flex-shrink: 0; height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    background: rgba(30,30,32,0.92);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 0.5px solid rgba(255,255,255,0.06);
}
.top-bar-left { display: flex; align-items: center; gap: 8px; }
.status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff453a;
    transition: background 0.3s ease;
}
.status-dot.connected { background: #30d158; }
.status-text { font-size: 13px; color: #8e8e93; transition: color 0.3s ease; }
.top-bar-title { font-size: 16px; font-weight: 600; color: #e5e5e7; letter-spacing: -0.2px; }
.send-rate { font-size: 12px; color: #636366; font-variant-numeric: tabular-nums; }

/* --- Main content --- */
.content {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 12px 20px; gap: 14px;
    min-height: 0;
}

/* --- Control row: throttle + attitude side by side --- */
.control-row {
    display: flex; align-items: center; gap: 20px;
}

/* --- Throttle --- */
.throttle-group {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.throttle-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: #636366;
}
.throttle-track {
    position: relative; width: 80px; height: 200px;
    background: rgba(44,44,46,0.85); border-radius: 40px;
    border: 0.5px solid rgba(255,255,255,0.06);
    overflow: hidden;
}
.throttle-detent {
    position: absolute; width: 32px; height: 1.5px;
    background: rgba(255,255,255,0.18);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none; z-index: 1;
}
.throttle-fill {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(10,132,255,0.3), rgba(10,132,255,0.06));
    border-radius: 0 0 40px 40px;
    transition: height 0.06s ease-out;
    pointer-events: none;
}
.throttle-slider {
    -webkit-appearance: none; appearance: none;
    width: 200px; margin: 0;
    background: transparent; outline: none;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    z-index: 2;
}
.throttle-slider::-webkit-slider-runnable-track {
    width: 200px; height: 80px;
    background: transparent;
    cursor: pointer;
}
.throttle-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 80px; height: 28px;
    background: #fff; border-radius: 40px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    margin-top: -14px;
}
/* Firefox */
.throttle-slider::-moz-range-track {
    width: 200px; height: 80px;
    background: transparent; border: none;
}
.throttle-slider::-moz-range-thumb {
    width: 80px; height: 28px;
    background: #fff; border-radius: 40px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    border: none;
}
.throttle-value {
    font-size: 13px; font-weight: 600; color: #e5e5e7;
    font-variant-numeric: tabular-nums;
}

/* --- Attitude indicator --- */
.indicator {
    position: relative; width: 150px; height: 150px;
    border-radius: 50%; overflow: hidden;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,0.12), 0 4px 16px rgba(0,0,0,0.3);
    flex-shrink: 0;
}
.attitude-inner {
    position: absolute; width: 100%; height: 200%;
    top: -50%; left: 0;
    transform-origin: center center;
    will-change: transform;
}
.sky {
    width: 100%; height: 50%;
    background: linear-gradient(to bottom, #3d6a9e, #5f92c4);
}
.ground {
    width: 100%; height: 50%;
    background: linear-gradient(to bottom, #7a5c10, #4d3a0c);
}
.horizon-line {
    position: absolute; left: 0; right: 0; top: 50%;
    height: 2px; background: rgba(255,255,255,0.9); transform: translateY(-50%);
}
.crosshair-h, .crosshair-v {
    position: absolute; background: rgba(255,255,255,0.85); z-index: 2;
    border-radius: 1px;
}
.crosshair-h { width: 20px; height: 2px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.crosshair-v { width: 2px; height: 20px; top: 50%; left: 50%; transform: translate(-50%, -50%); }

/* --- Card base --- */
.card {
    background: rgba(44,44,46,0.75);
    border-radius: 12px;
    border: 0.5px solid rgba(255,255,255,0.06);
}

/* --- Telemetry card --- */
.telemetry-card {
    padding: 10px 16px; display: flex; gap: 0;
    width: 100%; max-width: 320px;
}
.telemetry-item {
    flex: 1; text-align: center;
    position: relative;
}
.telemetry-item + .telemetry-item::before {
    content: ''; position: absolute; left: 0; top: 4px; bottom: 4px;
    width: 0.5px; background: rgba(255,255,255,0.06);
}
.telemetry-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.8px; color: #636366; margin-bottom: 2px;
}
.telemetry-value {
    font-size: 18px; font-weight: 500; color: #e5e5e7;
    font-variant-numeric: tabular-nums; letter-spacing: -0.3px;
}
.telemetry-unit { font-size: 12px; color: #636366; font-weight: 400; }

/* --- Altitude card (matches dashboard) --- */
.alt-card {
    padding: 10px 16px; display: flex; gap: 0;
    width: 100%; max-width: 320px;
}
.alt-item {
    flex: 1; text-align: center; position: relative;
}
.alt-item + .alt-item::before {
    content: ''; position: absolute; left: 0; top: 4px; bottom: 4px;
    width: 0.5px; background: rgba(255,255,255,0.06);
}
.alt-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.8px; color: #636366; margin-bottom: 2px;
}
.alt-value {
    font-size: 18px; font-weight: 500; color: #00c8ff;
    font-variant-numeric: tabular-nums; letter-spacing: -0.3px;
}
.alt-value-secondary {
    font-size: 18px; font-weight: 500; color: #e5e5e7;
    font-variant-numeric: tabular-nums; letter-spacing: -0.3px;
}

/* --- Buttons --- */
.btn-row { display: flex; gap: 10px; width: 100%; max-width: 320px; }
.btn {
    flex: 1; padding: 12px 0; text-align: center;
    font-size: 14px; font-weight: 600; border: none; border-radius: 10px;
    cursor: pointer; touch-action: manipulation;
    transition: opacity 0.15s ease;
}
.btn:active { opacity: 0.7; }
.btn-start { background: #30d158; color: #fff; }
.btn-calibrate {
    background: rgba(10,132,255,0.15); color: #0a84ff;
    border: 0.5px solid rgba(10,132,255,0.2);
}
.btn:disabled { background: rgba(44,44,46,0.5); color: #48484a; cursor: default; border-color: transparent; }
</style>
</head>
<body>

<div class="top-bar">
    <div class="top-bar-left">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText" class="status-text">Disconnected</span>
    </div>
    <span class="top-bar-title">Drone Control</span>
    <span id="sendRate" class="send-rate">0 Hz</span>
</div>

<div class="content">
    <div class="control-row">
        <div class="throttle-group">
            <div class="throttle-label">THROTTLE</div>
            <div class="throttle-track">
                <div id="thrFill" class="throttle-fill" style="height:50%"></div>
                <div class="throttle-detent"></div>
                <input id="throttle" class="throttle-slider" type="range" min="0" max="100" value="50" step="1">
            </div>
            <div id="thrValue" class="throttle-value">50%</div>
        </div>

        <div class="indicator">
            <div id="attitudeInner" class="attitude-inner">
                <div class="sky"></div>
                <div class="ground"></div>
                <div class="horizon-line"></div>
            </div>
            <div class="crosshair-h"></div>
            <div class="crosshair-v"></div>
        </div>
    </div>

    <div class="card telemetry-card">
        <div class="telemetry-item">
            <div class="telemetry-label">Roll</div>
            <div id="valRoll" class="telemetry-value">0.0<span class="telemetry-unit">&deg;</span></div>
        </div>
        <div class="telemetry-item">
            <div class="telemetry-label">Pitch</div>
            <div id="valPitch" class="telemetry-value">0.0<span class="telemetry-unit">&deg;</span></div>
        </div>
        <div class="telemetry-item">
            <div class="telemetry-label">Yaw</div>
            <div id="valYaw" class="telemetry-value">0.0<span class="telemetry-unit">&deg;</span></div>
        </div>
    </div>

    <div class="card alt-card">
        <div class="alt-item">
            <div class="alt-label">Alt</div>
            <div id="valAlt" class="alt-value">--<span class="telemetry-unit"> m</span></div>
        </div>
        <div class="alt-item">
            <div class="alt-label">V.Speed</div>
            <div id="valVS" class="alt-value-secondary">--<span class="telemetry-unit"> m/s</span></div>
        </div>
        <div class="alt-item">
            <div class="alt-label">H.Speed</div>
            <div id="valHS" class="alt-value-secondary">--<span class="telemetry-unit"> m/s</span></div>
        </div>
    </div>

    <div class="btn-row">
        <button id="btnStart" class="btn btn-start">Start Gyroscope</button>
        <button id="btnCalibrate" class="btn btn-calibrate" disabled>Calibrate</button>
    </div>
</div>

<script>
const WS_PORT = 8765;
const MIN_SEND_INTERVAL_MS = 8; // ~125Hz cap

let ws = null;
let gyroActive = false;
let currentBeta = 0;   // front-back tilt
let currentGamma = 0;  // left-right tilt
let currentAlpha = 0;  // compass heading (yaw)
let lastSendTime = 0;
let sendCount = 0;
let sendRateStart = performance.now();

const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const btnStart = document.getElementById('btnStart');
const btnCalibrate = document.getElementById('btnCalibrate');
const attitudeInner = document.getElementById('attitudeInner');
const valRoll = document.getElementById('valRoll');
const valPitch = document.getElementById('valPitch');
const valYaw = document.getElementById('valYaw');
const valAlt = document.getElementById('valAlt');
const valVS = document.getElementById('valVS');
const valHS = document.getElementById('valHS');
const sendRateEl = document.getElementById('sendRate');
const throttleEl = document.getElementById('throttle');
const thrValueEl = document.getElementById('thrValue');
const thrFillEl = document.getElementById('thrFill');

throttleEl.addEventListener('input', () => {
    const pct = parseInt(throttleEl.value);
    thrValueEl.textContent = pct + '%';
    thrFillEl.style.height = pct + '%';
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'throttle', value: pct / 100.0 }));
    }
});

// --- iOS requires permission request from user gesture ---
const needsPermission = typeof DeviceOrientationEvent !== 'undefined'
    && typeof DeviceOrientationEvent.requestPermission === 'function';

if (!needsPermission) {
    btnStart.style.display = 'none';
    startGyro();
}

btnStart.addEventListener('click', async () => {
    if (needsPermission) {
        try {
            const perm = await DeviceOrientationEvent.requestPermission();
            if (perm === 'granted') {
                startGyro();
                btnStart.disabled = true;
                btnStart.textContent = 'Gyroscope Active';
            } else {
                statusText.textContent = 'Permission denied';
            }
        } catch (e) {
            statusText.textContent = 'Permission error: ' + e.message;
        }
    } else {
        startGyro();
    }
});

btnCalibrate.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
            type: 'calibrate',
            beta: currentBeta,
            gamma: currentGamma,
            alpha: currentAlpha
        }));
        statusText.textContent = 'Calibrated!';
        setTimeout(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                statusText.textContent = 'Connected';
                statusDot.classList.add('connected');
            }
        }, 800);
    }
});

function startGyro() {
    gyroActive = true;
    window.addEventListener('deviceorientation', onOrientation);
    connectWS();
}

function onOrientation(e) {
    if (e.beta !== null) currentBeta = e.beta;
    if (e.gamma !== null) currentGamma = e.gamma;
    if (e.alpha !== null) currentAlpha = e.alpha;

    const roll = currentGamma;
    const pitch = currentBeta;
    const pitchOffset = Math.max(-1, Math.min(1, -pitch / 45)) * 45;
    attitudeInner.style.transform = 'rotate(' + roll + 'deg) translateY(' + pitchOffset + '%)';

    valRoll.innerHTML = roll.toFixed(1) + '<span class="telemetry-unit">&deg;</span>';
    valPitch.innerHTML = pitch.toFixed(1) + '<span class="telemetry-unit">&deg;</span>';
    valYaw.innerHTML = currentAlpha.toFixed(1) + '<span class="telemetry-unit">&deg;</span>';

    // Send binary orientation data, throttled
    const now = performance.now();
    if (now - lastSendTime < MIN_SEND_INTERVAL_MS) return;
    if (ws && ws.readyState === WebSocket.OPEN) {
        const buf = new Float32Array([currentBeta, currentGamma, currentAlpha, now]);
        ws.send(buf.buffer);
        lastSendTime = now;

        sendCount++;
        const elapsed = now - sendRateStart;
        if (elapsed >= 1000) {
            sendRateEl.textContent = Math.round(sendCount * 1000 / elapsed) + ' Hz';
            sendCount = 0;
            sendRateStart = now;
        }
    }
}

function connectWS() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        return;
    }

    const wsUrl = 'wss://' + location.hostname + ':' + WS_PORT;
    statusText.textContent = 'Connecting...';
    statusDot.classList.remove('connected');

    try {
        ws = new WebSocket(wsUrl);
    } catch (e) {
        statusText.textContent = 'Connection failed';
        scheduleReconnect();
        return;
    }

    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
        statusText.textContent = 'Connected';
        statusDot.classList.add('connected');
        btnCalibrate.disabled = false;
    };

    ws.onmessage = (e) => {
        // Receive telemetry from simulator
        try {
            const data = JSON.parse(e.data);
            if (data.type === 'telemetry') {
                valAlt.innerHTML = data.alt.toFixed(1) + '<span class="telemetry-unit"> m</span>';
                const vs = data.vs;
                const vsSign = vs >= 0 ? '+' : '';
                valVS.innerHTML = vsSign + vs.toFixed(1) + '<span class="telemetry-unit"> m/s</span>';
                valHS.innerHTML = data.hs.toFixed(1) + '<span class="telemetry-unit"> m/s</span>';
                if (vs > 0.1) valVS.style.color = '#0a84ff';
                else if (vs < -0.1) valVS.style.color = '#ff9f0a';
                else valVS.style.color = '#e5e5e7';
                valAlt.style.color = '#00c8ff';
            }
        } catch (err) { /* not JSON, ignore */ }
    };

    ws.onclose = () => {
        statusText.textContent = 'Disconnected';
        statusDot.classList.remove('connected');
        btnCalibrate.disabled = true;
        valAlt.innerHTML = '--<span class="telemetry-unit"> m</span>';
        valVS.innerHTML = '--<span class="telemetry-unit"> m/s</span>';
        valHS.innerHTML = '--<span class="telemetry-unit"> m/s</span>';
        scheduleReconnect();
    };

    ws.onerror = () => {};
}

function scheduleReconnect() {
    setTimeout(() => {
        if (gyroActive) connectWS();
    }, 2000);
}
</script>
</body>
</html>
